{% extends "base.html" %}

{% block title %}
Edit Review - Scently
{% endblock %}

{% block content %}

<div class="container my-5">

    <div class="row justify-content-center">
        <div class="col-md-7">

            <h1 class="text-center mb-4">Edit Your Review</h1>

            <div class="card shadow-sm">
                <div class="card-body">

                    <form method="POST">
                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form.rating.label_tag }}
                            {{ form.rating }}
                            {{ form.rating.errors }}
                        </div>

                        <div class="mb-3">
                            {{ form.comment.label_tag }}
                            {{ form.comment }}
                            {{ form.comment.errors }}
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Changes
                        </button>

                    </form>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
